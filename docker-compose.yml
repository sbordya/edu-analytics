services:
  metabase:
    image: metabase/metabase:v0.58-lts
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: admin
      MB_DB_PASS: admin
    volumes:
      - ./helper/metabase:/scripts:ro
    # entrypoint: /scripts/entrypoint.sh
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./helper/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "admin"]
      interval: 5s
      timeout: 5s
      retries: 3

  # adminer:
  #   image: adminer:latest
  #   ports:
  #     - "8080:8080"
  #   restart: unless-stopped

volumes:
  pgdata:
    name: pgdata
